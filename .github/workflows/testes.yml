name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  janela-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/compilar.py
      - run: python scripts/testar_binario.py dist\meshcore-tracker\meshcore-tracker.exe
      - run: python scripts/testar_janela.py dist\meshcore-tracker\meshcore-tracker.exe janela-windows.png
      - run: choco install innosetup --no-progress -y
      - run: iscc /DVersao=0.0.0 instalador\windows.iss
      - name: Testar a janela do programa instalado, tres vezes
        shell: pwsh
        run: |
          $setup = Get-ChildItem instalador-saida\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Meshcore Tracker\meshcore-tracker.exe'
          foreach ($i in 1..3) {
            python scripts/testar_janela.py $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captura-windows
          path: janela-windows.png
          if-no-files-found: warn

  janela-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Criar o pacote
        run: bash instalador/criar_deb.sh 0.0.0
      - name: Instalar o pacote
        run: sudo apt-get update && sudo apt-get install -y ./instalador-saida/MeshcoreTracker-0.0.0-ubuntu-amd64.deb
      - run: sudo apt-get install -y xvfb openbox wmctrl imagemagick dbus-x11
      - run: python scripts/testar_binario.py /usr/bin/meshcore-tracker
      - name: Testar a janela
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99
          openbox &
          sleep 2
          dbus-run-session -- python scripts/testar_janela.py /usr/bin/meshcore-tracker "janela-${{ matrix.os }}.png"
          for i in 1 2; do
            dbus-run-session -- python scripts/testar_janela.py /usr/bin/meshcore-tracker
          done
      - name: Desinstalar
        run: |
          sudo apt-get remove -y meshcore-tracker
          test ! -e /usr/bin/meshcore-tracker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captura-${{ matrix.os }}
          path: janela-${{ matrix.os }}.png
          if-no-files-found: warn
